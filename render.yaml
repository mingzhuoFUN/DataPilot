services:
  - type: web
    name: datapilot-demo
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile.all-in-one
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATAPILOT_MODEL_PROVIDER
        value: custom
      - key: DATAPILOT_MODEL_API_BASE
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: DATAPILOT_MODEL_NAME
        value: qwen-plus
      - key: DATAPILOT_ALLOW_CLIENT_PROVIDER_CONFIG
        value: "false"
      - key: DATAPILOT_MODEL_API_KEY
        sync: false
      - key: DATAPILOT_SITE_USERNAME
        value: datapilot
      - key: DATAPILOT_SITE_PASSWORD
        sync: false
      - key: DATAPILOT_MAX_UPLOAD_MB
        value: "10"
      - key: DATAPILOT_EXECUTION_TIMEOUT_SEC
        value: "45"
      - key: DATAPILOT_MODEL_READ_TIMEOUT_SEC
        value: "180"
      - key: DATAPILOT_MAX_ANALYSIS_ROUNDS
        value: "6"
