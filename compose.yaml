name: datapilot

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${DATAPILOT_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./demo/chat_v2/frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: /api
        DATAPILOT_BACKEND_INTERNAL_URL: http://backend:8200
    environment:
      NODE_ENV: production
    restart: unless-stopped

  backend:
    build:
      context: ./demo/chat_v2
      dockerfile: Dockerfile.backend
    environment:
      DATAPILOT_MODEL_PROVIDER: ${DATAPILOT_MODEL_PROVIDER:-local}
      DATAPILOT_MODEL_API_BASE: ${DATAPILOT_MODEL_API_BASE:-http://mock:8000/v1}
      DATAPILOT_MODEL_NAME: ${DATAPILOT_MODEL_NAME:-DeepAnalyze-8B}
      DATAPILOT_MODEL_API_KEY: ${DATAPILOT_MODEL_API_KEY:-}
      DATAPILOT_ALLOW_CLIENT_PROVIDER_CONFIG: ${DATAPILOT_ALLOW_CLIENT_PROVIDER_CONFIG:-true}
      DATAPILOT_CORS_ORIGINS: ${DATAPILOT_CORS_ORIGINS:-*}
      DATAPILOT_EXECUTION_MODE: local
      DATAPILOT_WORKSPACE_BASE: /app/workspace
      NO_PROXY: localhost,127.0.0.1,mock,backend
    volumes:
      - datapilot-workspace:/app/workspace
    depends_on:
      mock:
        condition: service_started
    restart: unless-stopped

  mock:
    build:
      context: ./demo/mock_vllm
    restart: unless-stopped

volumes:
  datapilot-workspace:
