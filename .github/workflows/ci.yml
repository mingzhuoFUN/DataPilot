name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/chat_v2/requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q deepanalyze.py API demo/mock_vllm demo/chat_v2/backend_app
      - name: Run backend tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/chat_v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/chat_v2/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all-in-one deployment image
        run: docker build -f deploy/Dockerfile.all-in-one -t datapilot:ci .
      - name: Run container smoke test
        run: |
          docker run --detach --name datapilot-ci -p 8080:8080 datapilot:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then
              curl --fail --silent http://127.0.0.1:8080/ | grep -q DataPilot
              exit 0
            fi
            sleep 2
          done
          docker logs datapilot-ci
          exit 1
      - if: always()
        run: docker rm --force datapilot-ci || true
